<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理・稼働状況ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#16a34a', 700: '#15803d', 800: '#166534' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 sm:py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="w-full sm:w-auto text-center sm:text-left">
                <h1 class="text-base sm:text-xl font-bold tracking-tight flex items-center justify-center sm:justify-start gap-2">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span>シフト稼働状況ダッシュボード</span>
                </h1>
                <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5">承諾・未回答の切り口でソート・検索</p>
            </div>
            <!-- Tab Navigation -->
            <div class="flex w-full sm:w-auto bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 sm:flex-none px-3 py-2 text-xs sm:text-sm font-medium rounded-md transition bg-emerald-600 text-white shadow text-center">
                    📅 日別サマリー
                </button>
                <button onclick="switchTab('staff')" id="tab-staff" class="flex-1 sm:flex-none px-3 py-2 text-xs sm:text-sm font-medium rounded-md transition text-slate-300 hover:text-white text-center">
                    👤 スタッフ別一覧
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-8">
        <!-- TAB 1: Daily Summary -->
        <div id="view-daily" class="space-y-4 sm:space-y-6">
            <!-- Controls / Filters -->
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
                <div class="grid grid-cols-1 sm:flex sm:flex-wrap gap-2.5 sm:gap-3 items-center">
                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">日付検索</label>
                        <input type="text" id="filter-daily-date" placeholder="例: 09月14日" oninput="filterDailyTable()" class="w-full sm:w-auto px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">時間帯フィルター</label>
                        <select id="filter-daily-time" onchange="filterDailyTable()" class="w-full sm:w-auto px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">すべて</option>
                            <option value="08:00-14:30">08:00-14:30</option>
                            <option value="10:00-18:00">10:00-18:00</option>
                            <option value="13:30-21:30">13:30-21:30</option>
                            <option value="10:00-21:30">10:00-21:30</option>
                        </select>
                    </div>
                </div>
                <div class="text-xs sm:text-sm text-slate-500 text-right sm:text-left">
                    表示件数: <span id="count-daily" class="font-bold text-slate-700"></span> 件
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap sm:whitespace-normal" id="table-daily">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 text-[11px] sm:text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortDailyTable('日付')">日付 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortDailyTable('時間帯')">時間帯 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 text-right cursor-pointer hover:bg-slate-200 transition text-emerald-700" onclick="sortDailyTable('承諾')">承諾 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 text-right cursor-pointer hover:bg-slate-200 transition text-amber-700" onclick="sortDailyTable('未回答')">未回答 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 text-right cursor-pointer hover:bg-slate-200 transition" onclick="sortDailyTable('合計')">合計 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 text-center">稼働割合 (承諾 / 未回答)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-xs sm:text-sm" id="tbody-daily">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 2: Staff Schedule -->
        <div id="view-staff" class="space-y-4 sm:space-y-6 hidden">
            <!-- Controls / Filters & Legend -->
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
                    <div class="grid grid-cols-1 sm:flex sm:flex-wrap gap-2.5 sm:gap-3 items-center">
                        <div class="w-full sm:w-auto">
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">スタッフ名検索</label>
                            <input type="text" id="filter-staff-name" placeholder="例: 桑原" oninput="filterStaffTable()" class="w-full sm:w-auto px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="w-full sm:w-auto">
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">日付フィルター</label>
                            <input type="text" id="filter-staff-date" placeholder="例: 09月13日" oninput="filterStaffTable()" class="w-full sm:w-auto px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="w-full sm:w-auto">
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">回答状況</label>
                            <select id="filter-staff-status" onchange="filterStaffTable()" class="w-full sm:w-auto px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="">すべて</option>
                                <option value="承諾">承諾</option>
                                <option value="未回答">未回答</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-xs sm:text-sm text-slate-500 text-right sm:text-left">
                        表示件数: <span id="count-staff" class="font-bold text-slate-700"></span> 件
                    </div>
                </div>

                <!-- 英語能力の凡例 (Legend) -->
                <div class="pt-2 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-[11px] sm:text-xs text-slate-600">
                    <span class="font-semibold text-slate-700 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        英語能力の凡例:
                    </span>
                    <span class="inline-flex items-center gap-1"><span class="text-slate-600 font-mono">★★★</span> ビジネス会話</span>
                    <span class="inline-flex items-center gap-1"><span class="text-slate-600 font-mono">★★☆</span> 日常会話・接客</span>
                    <span class="inline-flex items-center gap-1"><span class="text-slate-600 font-mono">★☆☆</span> 簡単な案内</span>
                    <span class="inline-flex items-center gap-1"><span class="text-slate-300 font-mono">☆☆☆</span> なし</span>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap sm:whitespace-normal" id="table-staff">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 text-[11px] sm:text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortStaffTable('ID')">ID ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortStaffTable('スタッフ名')">スタッフ名 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 text-center cursor-pointer hover:bg-slate-200 transition" onclick="sortStaffTable('英語レベル')">英語 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortStaffTable('役割区分')">役割区分 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortStaffTable('日付')">日付 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition" onclick="sortStaffTable('時間帯')">時間帯 ↕</th>
                                <th class="py-2.5 px-3 sm:py-3 sm:px-4 cursor-pointer hover:bg-slate-200 transition text-center" onclick="sortStaffTable('回答状況')">回答状況 ↕</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-xs sm:text-sm" id="tbody-staff">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

            const tbody = document.getElementById('tbody-staff');
            tbody.innerHTML = '';
            currentStaff.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                
                const badgeColor = row['回答状況'] === '承諾' 
                    ? 'bg-emerald-100 text-emerald-800 border-emerald-200' 
                    : 'bg-amber-100 text-amber-800 border-amber-200';

                // 英語レベル（0〜3）の星表示生成
                const getEnglishStarsHtml = (level) => {
                    const numTotal = 3;
                    let starsHtml = '<div class="flex items-center justify-center font-mono text-xs tracking-tighter">';
                    const filledStar = '<span class="text-slate-600">★</span>';
                    const emptyStar = '<span class="text-slate-200">★</span>';
                    for (let i = 0; i < numTotal; i++) {
                        starsHtml += (i < level) ? filledStar : emptyStar;
                    }
                    starsHtml += '</div>';
                    return starsHtml;
                };

                const englishStars = getEnglishStarsHtml(row['英語レベル']);

                tr.innerHTML = `
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 font-mono text-[11px] sm:text-xs text-slate-500">${row['ID']}</td>
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 font-semibold text-slate-900">${row['スタッフ名']}</td>
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 text-center">${englishStars}</td>
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 text-slate-600 text-[11px] sm:text-xs">${row['役割区分']}</td>
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 font-medium text-slate-800">${row['日付']}</td>
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 text-slate-600 font-mono text-[11px] sm:text-xs">${row['時間帯']}</td>
                    <td class="py-2.5 px-3 sm:py-3 sm:px-4 text-center">
                        <span class="inline-block px-2.5 py-0.5 text-[11px] sm:text-xs font-bold rounded-full border ${badgeColor}">${row['回答状況']}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('count-staff').innerText = currentStaff.length;
        }

        // Filtering Daily
        function filterDailyTable() {
            const dateQuery = document.getElementById('filter-daily-date').value.trim();
            const timeQuery = document.getElementById('filter-daily-time').value;

            currentDaily = dailyData.filter(row => {
                const matchDate = row['日付'].includes(dateQuery);
                const matchTime = timeQuery === '' || row['時間帯'] === timeQuery;
                return matchDate && matchTime;
            });
            sortDailyTable(dailySortCol, false);
        }

        // Filtering Staff
        function filterStaffTable() {
            const nameQuery = document.getElementById('filter-staff-name').value.trim().toLowerCase();
            const dateQuery = document.getElementById('filter-staff-date').value.trim();
            const statusQuery = document.getElementById('filter-staff-status').value;

            currentStaff = staffData.filter(row => {
                const matchName = row['スタッフ名'].toLowerCase().includes(nameQuery) || row['ID'].includes(nameQuery);
                const matchDate = row['日付'].includes(dateQuery);
                const matchStatus = statusQuery === '' || row['回答状況'] === statusQuery;
                return matchName && matchDate && matchStatus;
            });
            sortStaffTable(staffSortCol, false);
        }

        // Sorting Daily
        function sortDailyTable(col, toggle = true) {
            if (toggle) {
                if (dailySortCol === col) {
                    dailySortAsc = !dailySortAsc;
                } else {
                    dailySortCol = col;
                    dailySortAsc = true;
                }
            }
            currentDaily.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];
                if (typeof valA === 'number') {
                    return dailySortAsc ? valA - valB : valB - valA;
                } else {
                    return dailySortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });
            renderDailyTable();
        }

        // Sorting Staff
        function sortStaffTable(col, toggle = true) {
            if (toggle) {
                if (staffSortCol === col) {
                    staffSortAsc = !staffSortAsc;
                } else {
                    staffSortCol = col;
                    staffSortAsc = true;
                }
            }
            currentStaff.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];
                if (typeof valA === 'number') {
                    return staffSortAsc ? valA - valB : valB - valA;
                } else {
                    return staffSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });
            renderStaffTable();
        }

        // Initial Render
        renderDailyTable();
        renderStaffTable();
    </script>
</body>
</html>
